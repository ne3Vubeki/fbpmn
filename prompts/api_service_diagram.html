    rx: 6; ry: 6;

  .arrow-inherit {
    stroke: #aaa;
    stroke-width: 1.5;
    fill: none;

  .arrow-depend {

    stroke-dasharray: 6 3;
    fill: none;

  .arrow-meta {
    stroke: #E8A050;
    stroke-width: 1;
    stroke-dasharray: 2 3;

  }
  .arrow-flow {
